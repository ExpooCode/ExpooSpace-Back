server.port=8080
spring.datasource.url=jdbc:mariadb://localhost:3306/expoospace?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.show-sql=true

# Configuración básica de OpenAPI (común a todos los entornos)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**

# ===== CONFIGURACIÓN JWT (OBLIGATORIO) =====
# Clave secreta para firmar los tokens JWT (mínimo 256 bits en Base64)
# Genera una con: openssl rand -base64 64
jwt.secret=5pG8vKmNqR3tYwXzC9dFhJ2kLnM7oQsU4aVbWcXeYfZgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZ

# Tiempo de expiración del Access Token (en milisegundos)
# 900000 = 15 minutos
jwt.expiration=900000

# Tiempo de expiración del Refresh Token (en milisegundos)
# 604800000 = 7 días
jwt.refresh-expiration=60480000000

# ===== LOGGING (Opcional - para debug) =====
logging.level.ExpooCode.ExpooCode.security=DEBUG
logging.level.org.springframework.security=DEBUG
