spring.application.name=ExpooSpace

# Perfil activo (dev por defecto, prod en Render con variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Servidor
server.port=${PORT:8080}

# ===== CONFIGURACIÓN JWT =====
jwt.secret=${JWT_SECRET:5pG8vKmNqR3tYwXzC9dFhJ2kLnM7oQsU4aVbWcXeYfZgHiJkLmNoPqRsTuVwXyZaBcDeFgHiJkLmNoPqRsTuVwXyZ}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ===== OpenAPI/Swagger =====
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.show-actuator=false
springdoc.paths-to-match=/api/**